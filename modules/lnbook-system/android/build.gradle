plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.redcodesnoo.lnbook'
version = '1.0.0'

android {
  namespace "expo.modules.lnbooksystem"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.core:core:1.13.1"
  // On-device translation; language models are downloaded on demand.
  implementation "com.google.mlkit:translate:17.0.3"
}

dependencies {
  // Unit tests of the backup archives, on the computer (`gradlew :lnbook-system:testReleaseUnitTest`).
  testImplementation "junit:junit:4.13.2"
}

android {
  testOptions {
    unitTests.all {
      // A small heap proves that backups are streamed, never held in memory.
      maxHeapSize = "64m"
    }
  }
}
