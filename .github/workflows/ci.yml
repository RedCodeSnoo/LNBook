name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci

      - name: Validate the exported EPUB with epubcheck
        run: |
          EPUB_OUT="$RUNNER_TEMP/export.epub" npx jest src/epub/__tests__/buildEpub.test.ts --ci
          curl -fsSL -o "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          java -jar "$RUNNER_TEMP/epubcheck-5.4.0/epubcheck.jar" "$RUNNER_TEMP/export.epub"

      # Real plugins against the real sites: informative only, a site can be down.
      - name: Live source tests
        continue-on-error: true
        run: npm run test:live

      - name: Build APK
        id: apk
        uses: ./.github/actions/build-apk
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Backup archives (Kotlin, streamed): run on the computer with a 64 MB heap.
      - name: Native unit tests
        working-directory: android
        run: ./gradlew :lnbook-system:testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: LNBook-apk
          path: ${{ steps.apk.outputs.apk-path }}
          retention-days: 14

  # Informative only: the emulator flows stay visible but never block the pipeline
  # (they depend on emulator timing and on what the test tool can see in a web view).
  smoke:
    name: Emulator flows (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Build x86_64 APK
        id: apk
        uses: ./.github/actions/build-apk
        with:
          architectures: x86_64

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.apk.outputs.apk-path }}
          MAESTRO_CLI_NO_ANALYTICS: '1'
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r "$APK_PATH"
            scripts/ci-maestro.sh .maestro/smoke.yaml
            node scripts/make-sample-epub.js sample.epub
            scripts/ci-open-sample.sh sample.epub
            scripts/ci-maestro.sh .maestro/import.yaml
            scripts/ci-flows.sh reader quotes stats progress browse downloads backup voice translate

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: ~/.maestro/tests/**/shot-*.png
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: maestro-debug
          path: |
            ~/.maestro/tests/**
          retention-days: 7

  # Informative only, like the flows above: installs the published release on an emulator,
  # builds a large library, installs this version over it and checks that nothing was lost,
  # then makes a backup with this version and checks it on the computer.
  upgrade:
    name: Upgrade from the published version (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Download the published APK
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.apk' -p '*.apk.sha256' -D "$RUNNER_TEMP/published"
          (cd "$RUNNER_TEMP/published" && sha256sum -c ./*.sha256)
          VERSION="${TAG#v}"
          NEXT="${VERSION%.*}.$(( ${VERSION##*.} + 1 ))"
          echo "apk=$(ls "$RUNNER_TEMP"/published/*.apk)" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Published $TAG, this build is $NEXT"

      # The published APK is ARM only. If the emulator cannot run it, the test falls back to
      # the same version built from its tag for x86_64, with the same key.
      - name: Switch to the published version
        env:
          TAG: ${{ steps.published.outputs.tag }}
        run: git fetch --depth=1 origin tag "$TAG" && git checkout -q "$TAG"

      - name: Build the published version for x86_64
        id: old-apk
        uses: ./.github/actions/build-apk
        with:
          version: ${{ steps.published.outputs.version }}
          architectures: x86_64
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Keep it and switch back
        env:
          OLD_APK: ${{ steps.old-apk.outputs.apk-path }}
        run: |
          cp "$OLD_APK" "$RUNNER_TEMP/published-x86_64.apk"
          git checkout -q "$GITHUB_SHA"

      # Same signature as the releases, and a higher version: an update, not a new app.
      - name: Build x86_64 APK signed with the release key
        id: apk
        uses: ./.github/actions/build-apk
        with:
          version: ${{ steps.published.outputs.next }}
          architectures: x86_64
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Upgrade test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OLD_APK: ${{ steps.published.outputs.apk }}
          NEW_APK: ${{ steps.apk.outputs.apk-path }}
          MAESTRO_CLI_NO_ANALYTICS: '1'
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: scripts/ci-upgrade.sh "$OLD_APK" "$NEW_APK" upgrade-results "$RUNNER_TEMP/published-x86_64.apk"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upgrade-results
          path: |
            upgrade-results/**
            ~/.maestro/tests/**/shot-*.png
          if-no-files-found: ignore
          retention-days: 14
