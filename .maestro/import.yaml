# Runs after the sample EPUB was opened with the app ("Open with" intent).
appId: com.redcodesnoo.lnbook
---
- extendedWaitUntil:
    visible: 'Sample Saga, Ada Author.*'
    timeout: 60000
- takeScreenshot: shot-library
- tapOn: 'Sample Saga, Ada Author.*'
- assertVisible: 'Ada Author'
- assertVisible: '0 / 5 chapters'
- takeScreenshot: shot-novel
- scrollUntilVisible:
    element: '.*Chapter 4: End.*'
    direction: DOWN
- assertVisible: '.*Volume 2 – Dusk.*'
- tapOn: '.*Volume 2 – Dusk.*'
- assertNotVisible: '.*Chapter 4: End.*'
