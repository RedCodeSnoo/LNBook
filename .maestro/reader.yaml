# Runs after import.yaml: reads the first chapter, leaves, and comes back to the same place.
# The footer of the reader ("12 %") is native: it tells that the chapter is displayed.
appId: com.redcodesnoo.lnbook
---
- launchApp
- tapOn: 'Sample Saga, Ada Author.*'
- tapOn: 'Start'
- extendedWaitUntil:
    visible: '[0-9]+ %'
    timeout: 30000
# The text itself is only checked when the web view exposes it to the test tool.
- extendedWaitUntil:
    visible: '.*Prologue paragraph 1\..*'
    timeout: 10000
    optional: true
# A tap in the middle shows the bars.
- tapOn:
    point: '50%,50%'
- assertVisible: 'Position in the chapter'
- assertVisible: 'Reading settings'
- tapOn: 'Reading settings'
- assertVisible: 'Page theme'
- tapOn: 'Sepia'
- back
- tapOn:
    point: '50%,40%'
- assertNotVisible: 'Position in the chapter'
# Scroll, leave, and come back: the reader opens further than the beginning.
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- back
- assertVisible: 'Continue: Prologue'
- tapOn: 'Continue: Prologue'
- extendedWaitUntil:
    visible: '[0-9]+ %'
    timeout: 30000
- tapOn:
    point: '50%,50%'
- assertVisible: 'Position in the chapter'
- assertNotVisible: '0 %'
