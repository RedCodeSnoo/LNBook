# Runs after reader.yaml: saves a quote in a new folder, finds it on the novel page and
# checks that the reading time reached the history.
appId: com.redcodesnoo.lnbook
---
- launchApp
- tapOn: 'Sample Saga, Ada Author.*'
- tapOn: 'Continue: Prologue'
- extendedWaitUntil:
    visible: '[0-9]+ %'
    timeout: 30000
# Select a word with a long press, then use the custom selection menu.
- longPressOn:
    point: '50%,45%'
- tapOn: 'Favourite quote'
- assertVisible: 'Folders'
- tapOn: 'New folder'
- inputText: 'Tragic'
- pressKey: Enter
- assertVisible: 'Tragic'
- tapOn: 'Save'
- back
- tapOn: 'Quotes'
- scrollUntilVisible:
    element: 'Tragic 1'
    direction: DOWN
- assertVisible: 'All 1'
- back
- tapOn: 'History'
- assertVisible: 'Today'
- assertVisible: 'Sample Saga'
# More → Quotes: the folders are always listed, and one can be prepared in advance.
- tapOn: 'More'
- tapOn: 'Quotes'
- assertVisible: 'Tragic 1'
- tapOn: 'New folder'
- inputText: 'Later'
- tapOn: 'Save'
- assertVisible: 'Later 0'
- tapOn: 'Later 0'
- assertVisible: 'No quote in this folder yet.'
