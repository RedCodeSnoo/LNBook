# Backup screen, and the app update found on GitHub: the development build is older than
# any release, so the card appears; the download, the checksum and the data backup run
# until Android asks to allow installations.
appId: com.redcodesnoo.lnbook
---
- launchApp
- tapOn: 'More'
- tapOn: 'Backup and restore'
- assertVisible: 'Create a backup'
- scrollUntilVisible:
    element: 'Import an LNReader backup'
    direction: DOWN
- scrollUntilVisible:
    element: 'Create a backup'
    direction: UP
- tapOn: 'Create a backup'
- assertVisible: 'Downloaded chapters and imported books'
- tapOn: 'Cancel'
- tapOn: 'Back'
- tapOn: 'About'
- tapOn: 'Check for updates'
- extendedWaitUntil:
    visible: 'Open the Updates tab to install it'
    timeout: 30000
- tapOn: 'Open the Updates tab to install it'
# The Updates tab has the same button at the top, with the result under it.
- assertVisible: 'Check for updates'
- assertVisible: 'Version .* available'
- tapOn: 'Download and install'
- extendedWaitUntil:
    visible: 'Allow the installation'
    timeout: 240000
- tapOn: 'Cancel'
